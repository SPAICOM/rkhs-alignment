[project]
name = "rkhs-alignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "wandb>=0.29.0",
]

[tool.pytest.ini_options]
# Run the tests against the repo checkout rather than an installed copy.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 79

[tool.ruff.lint]
extend-select = [
    'C4',
    'SIM',
    'UP',
    'TC',
    'I',
    'NPY',
    'PERF',
    'E',
]
fixable = ['ALL']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "polars>=1.35.1",
    "pytest>=9.1.1",
]
