# Figure (ii): RKA against Procrustes and the neural baselines, over the
# pilot budget.
#
# One figure, one panel per metric (accuracy, MRR), each plotting the
# field against the number of semantic pilots N. Colour is the method,
# line style is the pilot design, and the band is +/- 1 sd over the seeds.
#
# Nothing here is left to an inner selection:
#
#   - the rate is pinned (`symbols`), written into whichever knob each
#     preset declares, so every method spends the same airtime;
#   - RKA's lambda is not selected per fit but *read back* per budget from
#     the CSVs `lambda_sweep.py` wrote, at the same chart and the same
#     rate. Selecting it on a held-out slice of the pilots is itself
#     sample-inefficient, and at small budgets that would show up as a
#     property of RKA rather than of the selection rule.
#
# So `just lambda-sweep` has to have run first, on the same axes -- which
# is what `axes/default.yaml` exists to guarantee.
#
#   just pilot-sweep
#   uv run scripts/pilot_sweep.py 'seeds=[0, 1, 2]'
#   uv run scripts/pilot_sweep.py 'charts=[{preprocess: pca}]'
#   uv run scripts/pilot_sweep.py data=semasia_mnist
#   uv run scripts/pilot_sweep.py plot_only=true 'drop=[direct_mlp]'

defaults:
  - axes: default
  - data: semasia
  # Order matters twice: it is the order the methods are fitted in, and
  # the order the figure assigns hues in. Procrustes first so it takes
  # the slot it holds in every other figure, RKA second.
  - alignment@methods.procrustes: procrustes
  - alignment@methods.rkhs: rkhs
  - alignment@methods.direct_mlp: direct_mlp
  - alignment@methods.residual_mlp: residual_mlp
  - _self_

# --- realisations -----------------------------------------------------
# One entry per independent realisation: it draws the candidate pool, it
# drives the randomised pilot designs, and it seeds the neural baselines'
# initialisation. Each writes its own records CSV as it finishes, so a
# run that dies costs one seed rather than the grid.
seeds: [0, 1, 2, 3, 4]

# Base seed for everything outside the per-realisation loop.
seed: 0

# --- encoder pairs ----------------------------------------------------
# Star topology: every other encoder transmits into one receiver.
#
# `receiver: null` does not mean "the first model listed" -- it means the
# *widest* agent available, resolved by measuring them. The receiver's
# latent space is where every transported latent has to land, so a narrow
# receiver caps what the channel can carry for every method at once and
# the comparison starts measuring the receiver instead of the alignment.
# Uncommenting a wider encoder in the data config therefore moves the
# receiver to it, with no other edit.
#
# Pin one explicitly to override the rule, or give `pairs` outright:
#
#   receiver: vit_small_patch16_224.augreg_in1k
#   pairs: [{source: regnety_016.pycls_in1k, target: ...}]
#
# The resolved direction and both widths are logged at the top of a run.
pairs: null
receiver: null
max_pairs: 4

# --- pilot budgets and designs ----------------------------------------
# `counts` / `multipliers` come from `axes/default.yaml`, shared with the
# lambda sweep so every budget here has a lambda measured at exactly that
# budget rather than interpolated to it.
pilots:
  # Colour is the method, line style is the design.
  #   stratified -> one quota per class, randomised within the class
  #   herding    -> kernel herding, the RKA paper's kernel-aware design
  strategies: [stratified, herding]

  # `pool_size` comes from `axes/default.yaml`, shared with the lambda
  # sweep. Re-drawn per seed here, which is what gives kernel herding --
  # deterministic over a fixed pool -- an error bar that means the same
  # thing as every other design's.

# --- lambda schedule --------------------------------------------------
# Read back from the lambda sweep rather than swept again: it already
# paid for these numbers. For each (chart, rate, budget) the schedule
# takes the lambda maximising `metric` in the matching CSV.
#
# The match is on the CSV's *columns*, not on its filename, so renaming
# an output cannot silently change which lambda is used.
#
# Set `enabled: false` to fall back to whatever each preset declares
# (which for `rkhs` means its own held-out selection over `lam_grid`).
lam_schedule:
  enabled: true
  methods: [rkhs]
  study: lambda_sweep
  metric: accuracy

  # A budget with no measured lambda falls back to the nearest studied
  # budget in log space, with a warning. false raises instead.
  nearest: true

# --- local standardisation -------------------------------------------
# Estimate each side's chart -- the truncated whitening or PCA of
# `alignment.preprocess` -- from that device's whole local split rather
# than from the pilots.
#
# Standardising one latent space needs no pairing, so a device can do it
# from everything it holds; only the paired rows cost airtime. Tying the
# chart to the pilot budget instead makes the low-budget regime look far
# worse than it is -- on the Digits pair it is worth +14 accuracy points
# at N=5 and +7 at N=8 -- and it changes which method wins: measured on
# regnety_016 -> vit_large at k=32, N=48, pure kernel alignment gains
# +2.9 pp from the local chart while RKA gains +0.3 pp, because RKA's
# rigid stage was partly absorbing the badly conditioned pilot
# covariance.
#
# On by default since 2026-09-18, in every study, so the chart means the
# same thing everywhere. `lambda_sweep.py` honours it too, so a schedule
# read back by another study was measured on the chart that study fits
# on. Results produced before that date are on the pilot-fitted chart
# and are not comparable.
use_local_context: true

# --- receiver decoder -------------------------------------------------
decoder:
  enabled: true
  # The receiver's task head, fitted on its own raw latents and never on
  # a transported one.
  #
  # `linear`, and the same head in every study: `pair_average.yaml` pools
  # the pilot and dimension sweeps and can only do that if both scored
  # with the head it declares, and the kernel-ablation configs have
  # always used it. Leaving the three sweeps on `mlp` meant the default
  # `just pilot-sweep` -> `just pair-average` chain silently mixed two
  # instruments; the lambda a sweep measures maximises accuracy, so the
  # head propagates into the schedule as well as the score.
  #
  # The case for `mlp` was measured on a pair this repo no longer leads
  # with, and does not carry over. A linear probe makes
  # `decoder(align(x))` an *affine* classifier on the transmitter's
  # latent, so post-alignment accuracy is capped by the best affine
  # classifier the transmitter admits. On the old vit_small pair that cap
  # was 0.9207, *above* the receiver's own 0.9120 -- the transmitter was
  # the better CIFAR-10 encoder -- so both methods sat on it and their
  # accuracy ordering was noise (RKA -0.0006/-0.0004/-0.0003 against
  # Procrustes at N=400/800/1536, while decoder-free MRR ranked it above:
  # +0.0014/+0.0077/+0.0078). The MLP head lifted the receiver to 0.9228
  # and restored "native RX" as a ceiling.
  #
  # The five pairs in `pair_average.yaml` are the other way round --
  # CIFAR-10-weak CNN transmitters into strong ViT receivers, chosen for
  # exactly that headroom -- so the transmitter's affine cap sits well
  # below the receiver's accuracy and the inversion does not arise.
  #
  # `mlp` also costs resolution, which matters for the pilot axis: an
  # expressive head partly rescues a badly fitted map, so over N=50..1536
  # the linear head spans 0.797..0.902 and the MLP only 0.823..0.902 --
  # low budgets look better than they are. Set `decoder.kind=mlp`
  # deliberately, and for every study in the chain at once, if a pair
  # ever puts the transmitter above the receiver again.
  kind: linear
  checkpoint_dir: models/decoders
  cache: true
  n_classes: 10
  l2: 1.0e-6
  mlp:
    hidden_dim: 512
    lr: 1.0e-3
    max_epochs: 100
    patience: 10
    batch_size: 256

# --- evaluation -------------------------------------------------------
eval:
  # One panel per entry, in this order.
  metrics: [accuracy, mrr]
  topk: [1, 5]

# Curves to leave off the figure without re-running anything; the records
# keep them, so adding one back is a `plot_only=true` redraw.
#
# A bare method leaves it out of every design; `method:design` leaves out
# one curve and keeps the method's others. The second form is what puts
# both designs on the kernel methods and one on the neural baselines --
# the eight curves of the full grid are more than a panel can carry:
#
#   drop: [direct_mlp, residual_mlp]                  # kernel methods only
#   drop: [direct_mlp:stratified, residual_mlp:stratified]
#
# Unknown names are an error rather than a silent no-op.
drop: []

# --- output -----------------------------------------------------------
# The figure lands at
#   <figures>/<study>/<dataset>/<chart>/<stem>.{pdf,png}
# the per-seed records at
#   <results>/<study>/<dataset>/<stem>_seed<k>.csv
# and the reduced curves at <results>/<study>/<dataset>/<stem>.csv.
output:
  study: pilot_sweep
  figures: figures
  results: results
  formats: [pdf, png]
  title: null           # null -> built from the run's configuration

# Skip a seed whose records are already on disk. These runs segfault
# intermittently on this machine, so the justfile re-invokes the script
# until it completes and this is what makes that cheap.
resume: true

# Reduce and draw from the records already on disk, fitting nothing.
plot_only: false

wandb:
  project: rkhs-alignment
  entity: null
  name: null
  group: null
  tags: []
  mode: online

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
