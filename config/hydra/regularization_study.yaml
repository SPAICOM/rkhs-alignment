# RKHS regularisation study (RKA paper, Fig. 1).
#
# Sweeps `lambda` for the RKHS residual and reads the curve against a flat
# Procrustes reference. Two things should show up, and both double as
# implementation checks: an interior optimum where the residual stage
# earns its place, and convergence back onto the Procrustes line as
# `lambda` grows (Eq. 17: A* -> 0, so f(x) -> Q*x).
#
# The winning `lambda` is printed at the end for pinning into the pilot
# study, which otherwise leaves the choice to the aligner's internal
# selection -- and that optimises held-out error on the whitened residual
# rather than the metric actually reported.
#
#   uv run scripts/regularization_study.py
#   uv run scripts/regularization_study.py data=semasia_mnist
#   uv run scripts/regularization_study.py pilots.n_pilots=2000

defaults:
  - data: semasia
  - alignment@sweep_method: rkhs
  - alignment@baselines.procrustes: procrustes
  - _self_

seed: 42

# --- encoder pairs ----------------------------------------------------
pairs: null
receiver: null
max_pairs: 4

# --- the sweep --------------------------------------------------------
# Log-spaced, wide enough on the right to show the Procrustes limit.
lam_grid:
  - 1.0e-8
  - 1.0e-7
  - 1.0e-6
  - 1.0e-5
  - 1.0e-4
  - 3.0e-4
  - 1.0e-3
  - 3.0e-3
  - 1.0e-2
  - 3.0e-2
  - 1.0e-1
  - 3.0e-1
  - 1.0
  - 1.0e+1
  - 1.0e+2
  - 1.0e+3

# --- calibration data -------------------------------------------------
# One pilot set per (source, repeat), shared by every lambda so the sweep
# measures regularisation rather than pilot luck.
pilots:
  n_pilots: 1000        # null = the whole training split
  strategy: herding     # random | kmeans | fps | stratified | herding
  n_repeats: 1          # herding is deterministic, so 1 unless randomised

# --- receiver decoder -------------------------------------------------
decoder:
  enabled: true
  # The receiver's fixed task head; see pilot_efficiency.yaml on why the
  # `mlp` alternative is the wrong instrument for ranking alignments.
  kind: linear
  checkpoint_dir: models/decoders
  cache: true
  n_classes: 10
  l2: 1.0e-6
  mlp:
    hidden_dim: 512
    lr: 1.0e-3
    max_epochs: 100
    patience: 10
    batch_size: 256

# --- evaluation -------------------------------------------------------
eval:
  # First entry is the metric the "best lambda" recommendation uses.
  metrics: [accuracy, mrr]
  topk: [1, 5]

output_dir: figures
plot_title: null

wandb:
  project: rkhs-alignment
  entity: null
  name: null
  group: null
  tags: []
  mode: online

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
