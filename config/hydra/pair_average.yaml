# Figures (ii) and (iii), averaged over encoder pairs.
#
# `pilot_sweep.py` and `dimension_sweep.py` each draw one encoder pair,
# with a band over seeds. This study fits nothing: it pools what those two
# already wrote for every pair listed below and draws the same two
# figures with error bars over *pairs* instead -- the spread a reader
# needs to judge whether a gap belongs to the method or to one lucky pair.
#
# Run the per-pair studies first; for any pair that is missing, this
# script stops and prints the exact commands that produce it.
#
#   just pair-average
#   just pair-average 'pilot.drop=[]' interval=std
#   just pair-average errorbars=false

defaults:
  - data: semasia
  - _self_

# --- the pairs --------------------------------------------------------
# Each is run on its own, receiver pinned, so every pair gets the lambda
# measured on its own pilots -- the way a deployment would tune it.
#
# Five CNN transmitters into five differently pre-trained ViT receivers,
# no encoder repeated. What RKA can gain is bounded by the headroom
# Procrustes leaves below the receiver's own accuracy (Spearman +0.92
# over 81 screened pairs), so the transmitters are CIFAR-10-weak and the
# receivers strong. Each was screened against every baseline on the same
# 8192 herded pilots before being listed: RKA led the best of the rest by
# +2.1..+2.3 pp at k=32 (a residual or direct MLP) and +2.3..+3.3 pp at
# k=128 (Procrustes), linear probe.
pairs:
  - source: regnety_016.pycls_in1k
    target: vit_large_patch16_224.augreg_in21k_ft_in1k
  - source: repvgg_b0.rvgg_in1k
    target: aimv2_large_patch14_224.apple_pt
  - source: mobilenetv3_large_100.ra_in1k
    target: vit_base_patch16_224.augreg_in21k
  - source: efficientvit_b0.r224_in1k
    target: beit_base_patch16_224.in22k_ft_in22k
  - source: ghostnet_100.in1k
    target: eva02_base_patch14_224.mim_in22k

# The chart every per-pair run used, and the head it scored with. The
# decoder is checked against the dimension-sweep rows, which record it;
# the pilot-sweep records do not, so keep the two runs on the same head.
chart:
  preprocess: whiten
decoder: linear

# --- figure (ii): the pilot budget ------------------------------------
pilot:
  study: pilot_sweep
  symbols: 32
  counts: [128, 256, 512, 1024, 2048, 4096, 8192]
  strategies: [herding, round_robin]
  # The realisations averaged within each pair before the spread over
  # pairs is taken. Only these seeds are read, and every pair has to have
  # all of them at every point. While a sweep is still running, draw with
  # the ones every pair already has, e.g. 'pilot.seeds=[0,1,2,3]'.
  seeds: [0, 1, 2, 3, 4]
  # As in `pilot_sweep.yaml`: `method` drops a method, `method:design`
  # one of its curves. A presentation choice; the pooled CSV keeps all.
  # The MLP baselines are shown under herding only.
  drop: [direct_mlp:round_robin, residual_mlp:round_robin]
  # One-column legend inside this metric's panel, at a matplotlib `loc`;
  # `single` is its `loc` when the figure draws one panel.
  legend:
    panel: accuracy
    loc: lower right
    single: lower right
  # The metrics drawn as panels, a subset of `eval.metrics`; null draws
  # them all. A subset is written under its own name, e.g. `..._accuracy`.
  panels: null

# --- figure (iii): the compression dimension --------------------------
dimension:
  study: dimension_sweep
  n_pilots: 8192
  strategy: herding
  ranks: [16, 32, 64, 128, 256, 512]
  # As `pilot.seeds`, read from `dimension_sweep.py` runs made with the
  # same `seeds`. null takes the single realisation on the lambda sweep's
  # own pilots instead (a run without `seeds`): 'dimension.seeds=null'.
  seeds: [0, 1, 2, 3, 4]
  legend:
    panel: mrr
    loc: upper left
    single: lower right
  panels: null          # as in `pilot`

eval:
  metrics: [accuracy, mrr]

# Error bar drawn around each mean over pairs: `ci95`, the 95% Student-t
# interval on the mean, or `std`, +/- one standard deviation across pairs.
# `errorbars: false` draws the means alone, into figures suffixed
# `_nobars` so both versions can be kept; the CSVs keep both columns.
errorbars: true
interval: ci95

# SVCCA takes CCA's hue, as in `dimension_sweep.yaml`.
hue_of:
  svcca: cca

# Geometry of both figures: one panel's width and height in inches, and a
# multiplier on every font. The lambda study draws its single panel at the
# same size (`output.panel` in `lambda_sweep.yaml`), with its own text
# scale. At 9 in a panel the text came out small next to the axes, and
# below 6 in lines and error bars turn heavy.
figure:
  panel: [6.0, 4.6]
  text_scale: 1.25
  # For a figure with one panel (`pilot.panels` or `dimension.panels`
  # naming one metric): the lambda study's `output.text_scale`, so
  # single-panel figures match.
  text_scale_single: 0.9

output:
  study: pair_average
  figures: figures
  results: results
  formats: [pdf, png]

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
