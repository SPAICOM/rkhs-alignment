# @package alignment
# PCA-RKA: Residual Kernel Alignment on a PCA-reduced latent, with the
# whitening replaced by a plain rotation onto the leading principal axes.
#
# Read against `rkhs` this is an ablation of the chart, holding the map
# fixed. The Karhunen-Loeve step does two things at once -- it discards
# the trailing directions, and it rescales the retained ones to equal
# variance -- and this preset does only the first, which isolates which
# half the method is living on.
#
# It is not obvious which way it should go:
#   - Whitening is what licenses the isometry. Procrustes minimises
#     ||X Q^T - Y|| over semi-orthogonal Q, which is the right model only
#     once both spaces have identity covariance; on merely rotated data a
#     rigid map cannot absorb a variance mismatch between matched
#     directions, so the rigid stage should lose something here.
#   - The kernel stage may gain. Whitening equalises every retained
#     direction, so an RBF distance weights a high-variance semantic axis
#     exactly like a low-variance one; under PCA the leading axes keep
#     their scale and dominate the distance, which is arguably the
#     geometry the residual should be measured in.
#
#   uv run scripts/compression_sweep.py
#   uv run scripts/evaluate_alignment.py alignment=pca_rkhs

_target_: src.alignment.RKHSAligner
_convert_: all

# --- kernel -----------------------------------------------------------
kernel: rbf
gamma: null
# The median-distance heuristic is now measured on an un-whitened cloud
# whose directions differ in scale by orders of magnitude, so the
# bandwidth that suited the whitened geometry need not suit this one:
#   uv run scripts/kernel_study.py aligner.preprocess=pca
bandwidth_scale: 1.0
degree: 3
coef0: 1.0

# --- regularisation ---------------------------------------------------
lam: 1.0e-3
lam_grid:
  - 1.0e-6
  - 1.0e-5
  - 1.0e-4
  - 1.0e-3
  - 1.0e-2
  - 1.0e-1
  - 1.0
  - 1.0e+1
  - 1.0e+2
  - 1.0e+3
val_fraction: 0.2
selection: nmse

# Units of `lam`. In the shift `s_i + N*lam` the Gram eigenvalues carry
# the kernel's scale and `lam` does not, so rescaling k -> c*k -- which
# leaves the hypothesis space untouched and only relabels its norm --
# multiplies every s_i by c, and one fixed grid then means something
# different for every kernel and every bandwidth. Mean eigenvalue of the
# centred Gram on whitened d=48 pilots, N=400:
#
#   rbf 0.63 | laplacian 0.63 | cosine 1.0 | linear 48 | poly 1.3e5
#
# so the grid below, topping out at 1e3, never regularises the polynomial
# kernel at all (its top mode needs lam ~ 1.8e3) -- it only ever
# interpolates, which is a sufficient explanation for the -0.041 recorded
# under `kernel` above. `bandwidth_scale` does the same thing more mildly:
# the mean eigenvalue moves 16x from scale 0.25 to 16, dragging the lambda
# axis under any joint sweep.
#
# `trace` divides that constant out by the mean non-zero eigenvalue, so
# the objective becomes
#
#   (1/N)||E - G||_F^2 + lam * s_mean * ||g||_H^2
#
# with `lam` dimensionless. It reparametrises the same one-parameter path
# rather than changing the model: every fit stays reachable, at
# lam / s_mean. For RBF at the median bandwidth s_mean ~ 0.63, so values
# here move by ~0.2 decades against the old convention -- but results
# cached under `n` are on a different axis, so re-run rather than resume
# across the switch.
#
# What it does NOT fix is the drift of the best lam with the pilot budget:
# under distance concentration the Gram spectrum flattens, every
# eigenvalue sits near s_mean and shrinkage bites at lam ~ 1/N. Read
# `rkhs_gram_flatness` (s_max/s_mean, -> 1 is bad) and compare budgets on
# effective degrees of freedom, not on lam.
# Set to `n`: the shift is N * lam, i.e. the objective is
# (1/N)||E - G||_F^2 + lam ||g||_H^2, which is the convention the
# experiments report. `trace` additionally divides out s_mean (see
# above) and `plain` is textbook kernel ridge, shift `lam` itself. All
# three are the same one-parameter path, so switching relabels the axis
# rather than changing the model -- but results cached under one are on a
# different axis, so re-run rather than resume across a switch.
lam_scaling: n            # n | trace | plain

# --- pipeline switches ------------------------------------------------
center_kernel: true
orthogonal_residual: true
ridge_B: 1.0e-8
max_points: 24000

# --- standardisation --------------------------------------------------
# Centre and rotate onto the top-k principal axes, keeping their
# variances. Orthonormal columns, so the transform is its own inverse on
# the retained subspace: no ridge, no shrinkage, nothing inverted.
preprocess: pca

eps: 1.0e-6

# The retained rank, and the rate -- `symbols` writes here exactly as it
# does for `rkhs`, so the two are rate-matched by construction.
n_components: null

# --- pilot design -----------------------------------------------------
pilot_strategy: herding

# --- channel rate -----------------------------------------------------
rate_key: n_components

seed: ${seed}
