# @package alignment
# Proto-anchor Parseval Frame Equalizer -- Fiorellino et al., "Frame-Based
# Zero-Shot Semantic Channel Equalization for AI-Native Communications".
#
# The anchor matrix is read as the *analysis operator* F of a frame rather
# than as a similarity table. The transmitter sends frame coefficients
# c = F x; the receiver synthesises its own latent from them with its own
# frame, y_hat = sum_n [c]_n g_n. The pipeline is therefore
#
#   whiten  ->  align            ->  colour
#   F~ = F (F^H F)^-1/2          c = F~ x          y_hat = G~^T c
#
# where the "whitening" is the Parsevalisation of the frame (not of the
# latents): it forces the frame operator to the identity, so the
# synthesis is a plain transpose with condition number 1 and nothing
# amplifies the residual mismatch between the two agents. Zero-shot --
# only the anchors are estimated, no map is fitted.
#
#   uv run scripts/evaluate_alignment.py alignment=ppfe
#   uv run scripts/evaluate_alignment.py alignment=ppfe alignment.n_anchors=1024

_target_: src.alignment.PPFEAligner
_convert_: all

# --- the frame --------------------------------------------------------
# Frame size N. null resolves to max(d_src, d_tgt), the paper's condition
# for both latent spaces to be fully spanned and the reconstruction to be
# exact; below it the equalizer still works but becomes a compression,
# projecting onto the anchor span. That is the paper's own rate/accuracy
# trade-off (their Fig. 2 sweeps exactly this number), and on real
# latents the trade is not monotonic -- measured on SEMASIA MNIST
# vit_base -> vit_small at N = 1000 pilots, accuracy / MRR run
# 0.87/0.49 at N=256, 0.68/0.55 at N=512, 0.72/0.58 at N=768 (= max(d))
# and 0.76/0.59 at N=1000. A smaller frame reconstructs a coarser latent
# that the receiver's probe happens to classify better, while a redundant
# one preserves the direction and so wins on retrieval. Worth sweeping:
#
#   uv run scripts/evaluate_alignment.py -m alignment=ppfe \
#       alignment.n_anchors=64,128,256,512,1024
#
# Capped at the pilot budget, since the anchors are drawn from the paired
# calibration samples.
n_anchors: null

# --- prototypical anchors (Alg. 1) ------------------------------------
# Cluster the transmitter's latents into N groups, draw M samples from
# each, and mean their embeddings. The support sets are what the two
# agents share, so the receiver builds the matching prototype from its
# own embeddings of the very same samples. null averages every member of
# the cluster, i.e. the true centroid; an int reproduces the paper's M.
n_prototype_samples: null

strategy: kmeans
medoids: false           # prototypes are means, not medoids
anchor_transfer: prototypes

# --- projection -------------------------------------------------------
# The frame-theoretic operator is the plain inner product. The paper
# l2-normalises its latents first, which makes cosine equivalent; set
# `similarity: cosine` to get that variant (a single fitted scalar then
# restores the scale the normalisation discarded).
similarity: inner

# The whole point of the method: cond(F) = 1 and F^+ = F^T exactly.
# Turning this off leaves a plain relative-representation equalizer (the
# paper's "FE" ablation) whose pseudo-inverse amplifies anchor
# correlation.
parseval: true

decode: pinv             # pinv (the Parseval synthesis) | ridge
decode_alpha: 1.0e-2

# --- standardisation --------------------------------------------------
# Whitening flattens the spectrum, leaving an N-anchor span that covers
# far less of the latent energy; standard scaling is the paper's setting
# and keeps the frame aligned with the dominant directions.
preprocess: standard

eps: 1.0e-6

n_components: null

# --- pilot design -----------------------------------------------------
# k-means, matching the prototypical-anchor construction above. The
# prototypes are cluster means of the pilots, so clustering the pilot
# selection too keeps the two consistent: the frame is built from
# representatives of dense latent regions, which is the property the
# paper credits prototypical anchors with. Used whenever the study does
# not state a pilot strategy of its own.
pilot_strategy: kmeans

# --- channel rate -----------------------------------------------------
# Which knob sets the number of coefficients this method puts on the
# channel per sample, so `symbols` in the comparison config can rate-match
# the field with one number. The frame size: c = F x is what is transmitted, so
# one coefficient per anchor and the whitening rank is irrelevant.
rate_key: n_anchors

seed: ${seed}
