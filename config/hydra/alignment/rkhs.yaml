# @package alignment
# Residual Kernel Alignment (RKA): f(z) = Q z + g(z), where Q is the rigid
# Procrustes map between the whitened spaces and g is a kernel-ridge
# correction constrained to be empirically uncorrelated with the source
# directions Q already used (G X^T = 0). The constraint is what keeps the
# two stages identifiable, and both are solved in closed form.

_target_: src.alignment.RKHSAligner
_convert_: all

# --- kernel -----------------------------------------------------------
# On the same pair, RBF dominates Laplacian at every bandwidth (peak R^2
# 0.029 against 0.018) and the polynomial kernel is actively harmful
# (-0.041: its correction moves the prediction away from the target out
# of sample). `linear` and `cosine` are *provably* inert here -- their
# RKHS is the space of linear functions, which is exactly what the
# constraint G X^T = 0 removes, so capacity is 0 and the fit returns the
# Procrustes solution bit-for-bit. Useful as a correctness check, useless
# as a model.
kernel: rbf               # rbf | laplacian | polynomial | linear | cosine
gamma: null               # null -> median-pairwise-distance heuristic

# Multiplier on the median-heuristic bandwidth: >1 smooths, <1 sharpens.
# The heuristic is computed on the whitened source cloud and knows
# nothing about the residual it will be asked to model, so it is a
# starting point rather than an answer -- and 1.0 is not the answer.
#
# Measured on the CIFAR-10 resnet50 -> vit_small pair at N=1536, k=48,
# reading the held-out fraction of the Procrustes residual explained:
#
#   scale   0.05    0.1    0.25   0.5    1.0    2.0    4.0    10.0
#   R^2     0.001  0.006  0.024  0.029  0.025  0.014  0.006  0.001
#
# A clean interior optimum at 0.5, with MRR and accuracy peaking with
# it (0.2763 / 0.8695 against 0.2707 / 0.8684 at 1.0). Left at 1.0 here
# because that is one pair; sweep it per pair before trusting it:
#
#   uv run scripts/kernel_study.py            # kernel x bandwidth
bandwidth_scale: 1.0
degree: 3                 # polynomial kernel only
coef0: 1.0                # polynomial kernel only

# --- regularisation ---------------------------------------------------
# Ridge of the residual stage; the effective shift is N * lam, matching
# H = K (K + N lam I)^-1. Used as-is when `lam_grid` is null.
lam: 1.0e-3

# Log-spaced sweep. The whole grid shares a single eigendecomposition of
# the centred Gram matrix, so sweeping is nearly free; the winner is
# picked on a held-out slice of the calibration set and the model is then
# refitted on all of it. Set to null to use `lam` directly.
lam_grid:
  - 1.0e-6
  - 3.0e-6
  - 1.0e-5
  - 3.0e-5
  - 1.0e-4
  - 3.0e-4
  - 1.0e-3
  - 3.0e-3
  - 1.0e-2
  - 3.0e-2
  - 1.0e-1
  - 3.0e-1
  - 1.0
  - 3.0
  - 1.0e+1
  - 1.0e+2
  - 1.0e+3
val_fraction: 0.2
selection: nmse           # nmse | cosine

# --- pipeline switches ------------------------------------------------
# Double-centre the Gram matrix. Keep this on: the model has no intercept
# in feature space, so without it the RKHS term absorbs a constant offset
# instead of genuine non-linear structure.
center_kernel: true

# Enforce G X^T = 0. Turning it off degrades the method to plain kernel
# ridge on the Procrustes residual -- the ablation for identifiability.
orthogonal_residual: true

# Relative ridge on B = X^T H X before solving; matters when the number of
# calibration points is small relative to the source dimension.
ridge_B: 1.0e-8

# Cap on the calibration points entering the kernel stage (the solve is
# O(N^3) in time, O(N^2) in memory). Q is always fitted on all of them.
# Needed because the SEMASIA data configs no longer thin the training
# split: handed all 50k rows, the exact solve would want a 50000x50000
# Gram matrix. Pilot budgets stay far below this, so it never binds there.
max_points: 4000

# --- standardisation --------------------------------------------------
preprocess: whiten        # Step 0 of the pipeline
eps: 1.0e-6

# Rank of the whitening: null keeps every direction, an int keeps the top-k
# principal directions, a float in (0,1] keeps that fraction of variance.
#
# This matters more than any other knob on wide encoder latents. Full-rank
# whitening equalises hundreds of noise directions with the signal ones,
# and in that many dimensions all pairwise distances concentrate, so the
# centred RBF Gram matrix degenerates towards the identity: its spectrum
# is flat, lambda has no smooth subspace to select, and the residual can
# only interpolate. Measured on a SEMASIA ViT pair at N=359 pilots, the
# RKA-vs-Procrustes gap is +0.000 at full rank and +0.013 at k=12 -- the
# paper's own latent dimensionality.
n_components: null

# --- pilot design -----------------------------------------------------
# Kernel herding (RKA paper, Sec. IV): greedily pick the pilot set whose
# kernel mean embedding best matches the full pool's, in the *same* RKHS
# the residual stage is then fitted in. That coupling is the point --
# the pilots are chosen in the geometry the method will use them in, so
# the residual sees a subset that represents the pool rather than one
# that happens to over-sample a mode. Used whenever the study does not
# state a pilot strategy of its own.
pilot_strategy: herding

# --- channel rate -----------------------------------------------------
# Which knob sets the number of coefficients this method puts on the
# channel per sample, so `symbols` in the comparison config can rate-match
# the field with one number. The whitening rank: the transmitter sends its
# truncated whitened latent, so k coefficients go on the channel.
rate_key: n_components

seed: ${seed}
